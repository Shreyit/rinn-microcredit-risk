<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Rinn modelling pipeline: data, split, prepare, models, evaluate, decide">
  <style>
    :root { --bg:#0b1220; --card:#111827; --stroke:#334155; --fg:#f1f5f9; --muted:#94a3b8; --flow:#38bdf8; --lock:#f43f5e; --ok:#22c55e; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#ffffff; --card:#f8fafc; --stroke:#cbd5e1; --fg:#0f172a; --muted:#475569; --flow:#0284c7; --lock:#e11d48; --ok:#16a34a; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--stroke); stroke-width: 1.5; }
    .h { font: 700 17px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: var(--fg); }
    .s { font: 400 12.5px ui-sans-serif, system-ui, sans-serif; fill: var(--muted); }
    .n { font: 700 12px ui-monospace, Menlo, monospace; fill: var(--flow); }
    .wire { fill: none; stroke: var(--flow); stroke-width: 2.5; stroke-dasharray: 8 7; animation: flow 1.1s linear infinite; }
    .lockwire { fill: none; stroke: var(--lock); stroke-width: 2; stroke-dasharray: 3 6; animation: flow 2.2s linear infinite; }
    .dot { fill: var(--flow); }
    .lock { fill: var(--lock); }
    .lockt { font: 700 12px ui-monospace, monospace; fill: var(--lock); }
    .glow { animation: glow 3s ease-in-out infinite; }
    .okt { font: 700 12px ui-monospace, monospace; fill: var(--ok); }
    @keyframes flow { to { stroke-dashoffset: -30; } }
    @keyframes glow { 0%,100% { stroke: var(--stroke) } 50% { stroke: var(--flow) } }
    @media (prefers-reduced-motion: reduce) { .wire, .lockwire, .glow { animation: none } .mover { display: none } }
  </style>

  <rect class="bg" width="1200" height="260" rx="16"/>

  <!-- wires -->
  <path id="w" class="wire" d="M170,110 H210 M360,110 H400 M550,110 H590 M740,110 H780 M930,110 H970"/>
  <path id="track" d="M40,110 H1160" fill="none" stroke="none"/>
  <circle class="dot mover" r="6"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#track"/></animateMotion></circle>

  <!-- stage cards -->
  <g>
    <rect class="card glow" x="20" y="55" width="150" height="110" rx="12"/>
    <text class="n" x="36" y="80">01</text><text class="h" x="36" y="104">Generate</text>
    <text class="s" x="36" y="126">roll → SHA-256 seed</text><text class="s" x="36" y="144">900 loans · 20 % default</text>
  </g>
  <g>
    <rect class="card glow" x="210" y="55" width="150" height="110" rx="12" style="animation-delay:.5s"/>
    <text class="n" x="226" y="80">02</text><text class="h" x="226" y="104">Split</text>
    <text class="s" x="226" y="126">stratified 80 / 20</text><text class="s" x="226" y="144">fit · val · test</text>
  </g>
  <g>
    <rect class="card glow" x="400" y="55" width="150" height="110" rx="12" style="animation-delay:1s"/>
    <text class="n" x="416" y="80">03</text><text class="h" x="416" y="104">Prepare</text>
    <text class="s" x="416" y="126">median impute</text><text class="s" x="416" y="144">standard scale (fit-only)</text>
  </g>
  <g>
    <rect class="card glow" x="590" y="55" width="150" height="110" rx="12" style="animation-delay:1.5s"/>
    <text class="n" x="606" y="80">04</text><text class="h" x="606" y="104">Model</text>
    <text class="s" x="606" y="126">LR · KNN · NB</text><text class="s" x="606" y="144">Tree · Linear SVM</text>
  </g>
  <g>
    <rect class="card glow" x="780" y="55" width="150" height="110" rx="12" style="animation-delay:2s"/>
    <text class="n" x="796" y="80">05</text><text class="h" x="796" y="104">Tune</text>
    <text class="s" x="796" y="126">K · depth · C sweeps</text><text class="s" x="796" y="144">on validation only</text>
  </g>
  <g>
    <rect class="card glow" x="970" y="55" width="200" height="110" rx="12" style="animation-delay:2.5s"/>
    <text class="n" x="986" y="80">06</text><text class="h" x="986" y="104">Evaluate &amp; decide</text>
    <text class="s" x="986" y="126">CM · precision · recall · F1</text><text class="s" x="986" y="144">ROC-AUC · cost threshold</text>
  </g>

  <!-- locked test set -->
  <path class="lockwire" d="M285,165 V215 H1070 V165"/>
  <rect class="lock" x="642" y="205" width="20" height="16" rx="3"/>
  <path d="M646,205 v-5 a6,6 0 0 1 12,0 v5" fill="none" stroke="var(--lock)" stroke-width="2.5"/>
  <text class="lockt" x="672" y="219">TEST SET — opened once, at step 06</text>
  <text class="okt" x="20" y="35">✓ provided cells untouched   ✓ no leakage   ✓ seeds fixed</text>
</svg>
